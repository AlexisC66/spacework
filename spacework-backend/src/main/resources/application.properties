spring.application.name=spacework-backend

# puerto del servidor local
server.port=8081

# conexion a la base de datos sql server local
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SpaceWork;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# config de hibernate para que no borre las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# datos del correo (usando gmail por ahora para pruebas)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:pruebas.spacework@gmail.com}
spring.mail.password=${MAIL_PASSWORD:password_smtp_app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
server.error.include-message=never
server.error.include-stacktrace=never

# JWT
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Rate limiting (login attempts)
login.max-attempts=${LOGIN_MAX_ATTEMPTS:3}
login.block-minutes=${LOGIN_BLOCK_MINUTES:15}

# Cron jobs
cron.reservation-cancel.fixed-rate=${CRON_CANCEL_RATE_MS:300000}
cron.reservation-cancel.pending-cutoff-hours=${CRON_CANCEL_CUTOFF_HOURS:2}

# BCrypt strength
security.bcrypt.strength=${BCRYPT_STRENGTH:12}

# ========================
# ACTUATOR — MONITOREO
# ========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN,SUPERADMIN
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
server.tomcat.mbean-registry.enabled=true
management.endpoint.metrics.enabled=true

# ========================
# BACKUP
# ========================
backup.directory=${BACKUP_DIR:./backups}

# ========================
# REPORTES PERIODICOS
# ========================
reportes.email.destinatario=${REPORTES_EMAIL:admin@spacework.com}
